[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sollutions-agentgate"
version = "0.1.0"
description = "Zero-trust security gateway for AI agent-to-agent communication"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Sollutions"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3", "httpx>=0.28,<1", "redis>=5.2,<9",
  "prometheus-client>=0.21,<1", "typer>=0.15,<1",
]

[project.scripts]
agentgate = "agentgate.cli:app"
agentgate-redteam = "agentgate.lab:app"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "mypy>=1.15,<3", "pip-audit>=2.8,<3", "build>=1.2,<2", "twine>=6,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentgate"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scripts/", "policies/", "examples/", "docs/", ".github/", "README.md", "LICENSE", "SECURITY.md", "CONTRIBUTING.md", "pyproject.toml", "uv.lock", "Makefile", "Dockerfile", "compose.yaml", ".gitignore", ".dockerignore", ".editorconfig"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".local", ".bootstrap", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/agentgate/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/agentgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
